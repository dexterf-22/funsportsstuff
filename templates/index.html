<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NHL Connections</title>
  <style>
    :root {
      --bg:        #f5f5f5;
      --surface:   #ffffff;
      --surface-2: #f0f0f0;
      --border:    #e0e0e0;
      --accent:    #f97316;
      --gold:      #f97316;
      --text:      #111111;
      --muted:     #666666;
      --danger:    #d32f2f;
      --radius:    10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    header { text-align: center; margin-bottom: 2.5rem; }
    header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
    header p  { margin-top: .4rem; color: var(--muted); font-size: .95rem; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      width: 100%;
      max-width: 560px;
    }

    /* ── Search form ── */
    .search-form { display: flex; flex-direction: column; gap: .9rem; }

    .field-label {
      font-size: .75rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--muted); margin-bottom: .3rem;
    }

    .autocomplete-wrap { position: relative; }

    .autocomplete-wrap input[type="text"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: .6rem .9rem;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
    }
    .autocomplete-wrap input[type="text"]:focus { border-color: var(--accent); }
    .autocomplete-wrap input[type="text"].selected {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface-2));
    }

    .dropdown {
      display: none; position: absolute;
      top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 7px; overflow: hidden;
      z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .dropdown.open { display: block; }

    .dropdown-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: .55rem .9rem; cursor: pointer; transition: background .1s;
    }
    .dropdown-item:hover, .dropdown-item.focused { background: var(--border); }
    .dropdown-item .di-name { font-size: .92rem; }
    .dropdown-item .di-era  { font-size: .78rem; color: var(--muted); }

    .btn {
      padding: .65rem 1.2rem; border: none; border-radius: 7px;
      font-size: .95rem; font-weight: 600; cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #ffffff; width: 100%; margin-top: .3rem; }
    .btn-primary:hover:not(:disabled) { opacity: .88; }


    /* ── Status ── */
    #status {
      max-width: 560px; width: 100%; margin-top: 1.4rem;
      text-align: center; font-size: .9rem; color: var(--muted); min-height: 1.4rem;
    }
    #status.error { color: var(--danger); }

    /* ── Result chain ── */
    #result { max-width: 560px; width: 100%; margin-top: 1rem; }

    .result-meta { text-align: center; margin-bottom: 1.2rem; font-size: .88rem; color: var(--muted); }
    .result-meta strong { color: var(--accent); font-size: 1.1rem; }

    .chain { display: flex; flex-direction: column; align-items: center; }

    /* Player node */
    .player-node {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem 1.2rem;
      width: 100%; text-align: center;
      animation: fadeIn .3s ease both;
    }
    .player-node.endpoint {
      border-color: var(--gold);
      background: color-mix(in srgb, var(--gold) 6%, var(--surface));
    }
    .player-node .pn-name { font-weight: 700; font-size: 1rem; }
    .player-node .pn-era  { font-size: .78rem; color: var(--muted); margin-top: .15rem; }

    /* Logo connector */
    .connector {
      display: flex; flex-direction: column; align-items: center;
      animation: fadeIn .3s ease both;
    }
    .v-line { width: 2px; height: 18px; background: var(--border); }

    .logo-node {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      min-width: 110px;
    }
    .logo-node img {
      width: 64px; height: 64px; object-fit: contain;
      display: block;
    }
    .logo-fallback {
      display: none;
      width: 64px; height: 64px;
      align-items: center; justify-content: center;
      font-size: .85rem; font-weight: 700;
      color: var(--accent);
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .logo-season { font-size: .75rem; color: var(--muted); white-space: nowrap; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: .4rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>
  <h1>NHL Connections</h1>
  <p>Find the shortest chain of teammates connecting any two players in history.</p>
</header>

<div class="card">

    <div>
      <div class="field-label">Player 1</div>

        <div class="dropdown" id="p1-drop"></div>
      </div>
    </div>
    <div>
      <div class="field-label">Player 2</div>
      <div class="autocomplete-wrap">
        <input type="text" id="p2-text" placeholder="Search by name…" autocomplete="off">
        <input type="hidden" id="p2-id">
        <div class="dropdown" id="p2-drop"></div>
      </div>
    </div>
    <button class="btn btn-primary" id="find-btn" disabled>Find Connection</button>
  </div>
</div>

<div id="status"></div>
<div id="result"></div>

// ── Autocomplete ──────────────────────────────────────────────────────────────

const findBtn  = document.getElementById('find-btn');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

function setupAC(textId, hiddenId, dropId) {
  const text   = document.getElementById(textId);
  const hidden = document.getElementById(hiddenId);
  const drop   = document.getElementById(dropId);
  let timer, focusIdx = -1, items = [];

  function closeDrop() { drop.classList.remove('open'); focusIdx = -1; }

  function renderItems(players) {
    items = players; focusIdx = -1; drop.innerHTML = '';
    if (!players.length) { closeDrop(); return; }
    players.forEach((p) => {
      const el = document.createElement('div');
      el.className = 'dropdown-item';
      el.innerHTML = `<span class="di-name">${esc(p.name)}</span><span class="di-era">${esc(p.era)}</span>`;
      el.addEventListener('mousedown', e => { e.preventDefault(); selectPlayer(p); });
      drop.appendChild(el);
    });
    drop.classList.add('open');
  }

  function moveFocus(dir) {
    const els = drop.querySelectorAll('.dropdown-item');
    if (!els.length) return;
    els[focusIdx]?.classList.remove('focused');
    focusIdx = Math.max(0, Math.min(els.length - 1, focusIdx + dir));
    els[focusIdx].classList.add('focused');
    els[focusIdx].scrollIntoView({ block: 'nearest' });
  }

  function selectPlayer(p) {
    text.value = p.name; hidden.value = p.id;
    text.classList.add('selected'); closeDrop(); updateFindBtn();
  }

  async function resolve() {
    if (hidden.value) return true;
    const q = text.value.trim();
    if (q.length < 2) return false;
    if (items.length) { selectPlayer(items[0]); return true; }
    try {
      const r = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
      const players = await r.json();
      if (players.length) { selectPlayer(players[0]); return true; }
    } catch {}
    return false;
  }

  text.addEventListener('input', () => {
    hidden.value = ''; text.classList.remove('selected'); updateFindBtn();
    clearTimeout(timer);
    const q = text.value.trim();
    if (q.length < 2) { closeDrop(); return; }
    timer = setTimeout(() => {
      fetch(`/api/search?q=${encodeURIComponent(q)}`)
        .then(r => r.json()).then(renderItems).catch(() => closeDrop());
    }, 280);
  });

  text.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && drop.classList.contains('open')) { e.preventDefault(); moveFocus(1); return; }
    if (e.key === 'ArrowUp'   && drop.classList.contains('open')) { e.preventDefault(); moveFocus(-1); return; }
    if (e.key === 'Escape') { closeDrop(); return; }
    if (e.key === 'Enter') {
      if (drop.classList.contains('open')) {
        e.preventDefault();
        if (focusIdx >= 0 && items[focusIdx]) selectPlayer(items[focusIdx]);
        else if (items.length) selectPlayer(items[0]);
      }
    }
  });

  document.addEventListener('click', e => {
    if (!text.contains(e.target) && !drop.contains(e.target)) closeDrop();
  });

  return { resolve };
}

const ac1 = setupAC('p1-text', 'p1-id', 'p1-drop');
const ac2 = setupAC('p2-text', 'p2-id', 'p2-drop');

function updateFindBtn() {
  const p1ok = document.getElementById('p1-id').value || document.getElementById('p1-text').value.trim().length >= 2;
  const p2ok = document.getElementById('p2-id').value || document.getElementById('p2-text').value.trim().length >= 2;
  findBtn.disabled = !(p1ok && p2ok);
}

// ── Path search ───────────────────────────────────────────────────────────────

findBtn.addEventListener('click', async () => {
  resultEl.innerHTML = '';
  statusEl.className = '';
  statusEl.innerHTML = '<span class="spinner"></span> Finding shortest path…';
  findBtn.disabled = true;

  try {
    const [r1, r2] = await Promise.all([ac1.resolve(), ac2.resolve()]);
    if (!r1 || !r2) {
      statusEl.textContent = 'Could not find one or both players — try a more specific name.';
      statusEl.className = 'error';
      return;
    }

    const p1 = document.getElementById('p1-id').value;
    const p2 = document.getElementById('p2-id').value;
    if (p1 === p2) { statusEl.textContent = 'Select two different players.'; statusEl.className = 'error'; return; }

    const r = await fetch(`/api/path?p1=${p1}&p2=${p2}`);
    const data = await r.json();
    if (!r.ok) { statusEl.textContent = data.error || 'Something went wrong.'; statusEl.className = 'error'; return; }
    statusEl.textContent = '';
    renderResult(data);
  } catch {
    statusEl.textContent = 'Network error — is the server running?';
    statusEl.className = 'error';
  } finally {
    findBtn.disabled = false;
  }
});

function renderResult({ hops, total_paths, steps }) {
  const hopLabel  = hops === 1 ? '1 connection' : `${hops} connections`;
  const pathLabel = total_paths === 1 ? '1 path' : `${total_paths.toLocaleString()} paths of this length`;

  let html = `<div class="result-meta"><strong>${hopLabel}</strong> &nbsp;·&nbsp; ${pathLabel}</div>`;
  html += '<div class="chain">';

  steps.forEach((step, i) => {
    const isEnd = i === 0 || i === steps.length - 1;

    if (i > 0) {
      const logoUrl = getLogoUrl(step.team, step.season);
      const delay   = `animation-delay:${i * 70}ms`;
      html += `
        <div class="connector" style="${delay}">
          <div class="v-line"></div>
          <div class="logo-node" title="${esc(step.team)} ${esc(step.season)}">
            ${logoUrl
              ? `<img src="${logoUrl}" alt="${esc(step.team)}" loading="lazy"
                      onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
              : ''}
            <span class="logo-fallback"${logoUrl ? '' : ' style="display:flex"'}>${esc(step.team)}</span>
            <div class="logo-season">${esc(step.season)}</div>
          </div>
          <div class="v-line"></div>
        </div>`;
    }

    html += `
      <div class="player-node${isEnd ? ' endpoint' : ''}" style="animation-delay:${i * 70}ms">
        <div class="pn-name">${esc(step.name)}</div>
        <div class="pn-era">${esc(step.era)}</div>
      </div>`;
  });

  html += '</div>';
  resultEl.innerHTML = html;
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
